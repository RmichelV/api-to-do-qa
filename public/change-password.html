<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change password · QA API Tester</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <h1 class="auth-title">Change password</h1>
      <p class="auth-subtitle">
        Your new password must be 12 to 128 characters long and different from your current one.
      </p>
      <form id="cp-form" novalidate>
        <div class="input-group">
          <label for="cp-current">Current password</label>
          <input type="password" id="cp-current" autocomplete="current-password" required />
        </div>
        <div class="input-group">
          <label for="cp-new">New password</label>
          <input type="password" id="cp-new" autocomplete="new-password" required />
        </div>
        <div class="input-group">
          <label for="cp-confirm">Confirm new password</label>
          <input type="password" id="cp-confirm" autocomplete="new-password" required />
        </div>
        <p id="cp-error" class="auth-error" role="alert" hidden></p>
        <p id="cp-success" class="auth-success" role="status" hidden>Password changed. Redirecting…</p>
        <button type="submit" id="cp-submit" class="btn-run-all">Change password</button>
      </form>
    </main>
    <script src="change-password.js"></script>
  </body>
</html>
