<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload CSV File · QA API Tester</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <div class="topbar__brand">
          <span aria-hidden="true">🤖</span>
          <span class="topbar__title">QA API Tester</span>
        </div>
        <nav class="topbar__nav">
          <div class="topbar__auth">
            <span id="auth-user-name" class="topbar__user"></span>
            <a class="ctrl-btn ctrl-btn--link" href="/">Tool</a>
            <a class="ctrl-btn ctrl-btn--link" href="/admin-users.html">Users</a>
            <a class="ctrl-btn ctrl-btn--link" href="/change-password.html">Change password</a>
            <button id="auth-logout" class="ctrl-btn ctrl-btn--logout">Logout</button>
          </div>
        </nav>
      </div>
    </header>

    <main class="admin-main">
      <section class="admin-card" aria-labelledby="csv-title">
        <h1 id="csv-title" class="auth-title">Upload CSV File</h1>
        <p class="auth-subtitle">
          Select one CSV file. The report will contain one Excel row per deliverable.
        </p>

        <div class="input-group">
          <label for="csv-file">CSV file</label>
          <input type="file" id="csv-file" accept=".csv,text/csv" />
        </div>
        <p id="csv-error" class="auth-error" role="alert" hidden></p>
        <p id="csv-success" class="auth-success" role="status" hidden></p>
        <p id="csv-selected-file" aria-live="polite" hidden></p>
        <div class="csv-actions">
          <button id="csv-run" class="ctrl-btn ctrl-btn--pdf" type="button" disabled>Run QA and Download Excel</button>
          <progress id="csv-progress" aria-label="CSV QA progress" hidden></progress>
        </div>
        <p id="csv-progress-label" role="status" hidden></p>

        <section class="admin-section" aria-labelledby="csv-columns-title">
          <h2 id="csv-columns-title" class="admin-subtitle">Required columns</h2>
          <p>Deliverable Id, Website, Links, Calls to Action, Completed Copy, Completed Page URL</p>
        </section>
      </section>
    </main>

    <script src="auth-bar.js" defer></script>
    <script type="module" src="upload-csv.js"></script>
  </body>
</html>
