# Production stack (design §8.2): MariaDB + Node app + Caddy.
# Do NOT use it for local development: docker-compose.dev.yml is the local
# database (db/README.md §1). Run this stack only on the server.
#
# All values come from one git-ignored file, /opt/api-to-do-qa/.env.production
# (created by ops/provision-db.sh), passed to compose for interpolation:
#   docker compose --env-file .env.production up -d --build
# Each service lists only the variables it needs, so the app container never
# receives MARIADB_ROOT_PASSWORD. DB_HOST must be `db` — the compose service
# name — so the app resolves the database on the internal network.
services:
  app:
    build: .
    image: api-to-do-qa:latest
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:?MIGRATE_DB_USER is required}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?MIGRATE_DB_PASSWORD is required}
      DB_SSL: ${DB_SSL:-false}
    expose:
      - "4000"
    # The app starts only after the database answers its healthcheck, so
    # `npm run migrate` / `create-admin` never race a half-initialized DB.
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mariadb:10.11
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:?MIGRATE_DB_USER is required}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?MIGRATE_DB_PASSWORD is required}
    volumes:
      # Keep this volume name: it already holds the server's database.
      - mariadb_data:/var/lib/mysql
      # Creates qa_app / qa_migrator (no DROP) on the first start only.
      - ./db/init-users.sh:/docker-entrypoint-initdb.d/10-init-users.sh:ro
    # Bound to the host loopback only: never reachable from the internet.
    # Admin access goes through an SSH tunnel (db/README.md §7).
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: always

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: always

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:
