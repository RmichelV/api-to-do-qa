<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · QA API Tester</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <h1 class="auth-title">QA API Tester</h1>
      <p class="auth-subtitle">Sign in with your email and password</p>
      <form id="login-form" novalidate>
        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="username" required />
        </div>
        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <p id="login-error" class="auth-error" role="alert" hidden></p>
        <button type="submit" id="login-submit" class="btn-run-all">Sign in</button>
      </form>
    </main>
    <script src="login.js"></script>
  </body>
</html>
